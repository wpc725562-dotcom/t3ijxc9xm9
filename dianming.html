<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFE08A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>随机点名器</title>
<style>
  :root{
    --yolk:#FFD43B;
    --yolk-d:#EFA90A;
    --ink:#2A2118;
    --ink2:#7A6748;
    --h:clamp(74px,21vw,104px);   /* 滚动条单格高度 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;padding:0;}
  body{
    position:fixed;inset:0;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 70% at 50% -10%, #FFF6D8 0%, rgba(255,246,216,0) 62%),
      linear-gradient(170deg,#FFFBF2 0%,#FFF3D6 45%,#FFE7A6 100%);
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
    overscroll-behavior:none;
  }
  #app{position:absolute;inset:0;overflow:hidden;}

  #s-main{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 16px);
    text-align:center;
  }
  .kicker{font-size:12.5px;font-weight:800;letter-spacing:3px;color:var(--ink2);margin:0 0 6px;}
  .title{
    margin:0;font-weight:900;letter-spacing:3px;line-height:1.15;
    font-size:clamp(28px,9vw,42px);
    text-shadow:0 3px 0 #fff, 0 8px 18px rgba(180,130,20,.20);
  }
  .title .br{color:var(--yolk-d);font-weight:700;opacity:.9;padding:0 2px;}

  /* ---------- 滚动窗口 ---------- */
  .reel{
    position:relative;width:min(100%,380px);height:calc(var(--h) * 3);
    margin-top:clamp(18px,4vh,32px);
    border-radius:24px;overflow:hidden;
    background:linear-gradient(180deg,#FFFDF6,#FFF4D8);
    box-shadow:inset 0 2px 10px rgba(160,120,20,.14), 0 10px 26px rgba(150,105,20,.20),
               0 0 0 3px #fff;
  }
  .reel::before,.reel::after{
    content:"";position:absolute;left:0;right:0;height:34%;pointer-events:none;z-index:3;
  }
  .reel::before{top:0;background:linear-gradient(180deg,rgba(255,250,235,.98),rgba(255,250,235,0));}
  .reel::after{bottom:0;background:linear-gradient(0deg,rgba(255,250,235,.98),rgba(255,250,235,0));}
  .reel .band{
    position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);
    height:var(--h);border-radius:16px;z-index:1;pointer-events:none;
    background:rgba(255,212,59,.28);
    box-shadow:0 0 0 2px rgba(239,169,10,.35) inset;
  }
  .strip{
    position:absolute;left:0;right:0;top:0;will-change:transform;z-index:2;
  }
  .strip .it{
    height:var(--h);display:flex;align-items:center;justify-content:center;
    font-weight:900;letter-spacing:2px;white-space:nowrap;
    font-size:clamp(26px,8.4vw,40px);color:#B9AC90;
    transition:color .15s;
  }
  .strip .it.mid{color:#C2410C;text-shadow:0 2px 0 #fff;}

  .btn{
    -webkit-appearance:none;appearance:none;border:0;cursor:pointer;
    font-family:inherit;font-weight:900;letter-spacing:2px;
    border-radius:999px;color:#4A3200;
    background:linear-gradient(180deg,#FFE071,#FFC61A);
    box-shadow:0 7px 0 #D89A00, 0 12px 24px rgba(190,130,0,.30);
    transition:transform .09s ease, box-shadow .09s ease;
    font-size:clamp(19px,5.8vw,25px);padding:17px 0;width:min(100%,300px);
    margin-top:clamp(18px,3.6vh,30px);
  }
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #D89A00, 0 6px 12px rgba(190,130,0,.26);}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  .tune{
    margin-top:13px;border:0;background:rgba(255,255,255,.75);color:var(--ink2);
    font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:1px;
    padding:8px 16px;border-radius:999px;cursor:pointer;
    box-shadow:0 2px 6px rgba(150,110,20,.14);
  }

  /* ---------- 结果层 ---------- */
  #s-result{
    position:absolute;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 22px);
    background:rgba(255,250,235,.9);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;transition:opacity .28s ease;text-align:center;
  }
  #s-result.on{opacity:1;pointer-events:auto;}
  #resultText{
    margin:0;font-weight:900;letter-spacing:2px;line-height:1.22;
    font-size:clamp(28px,9.4vw,48px);
    text-shadow:0 3px 0 #fff, 0 8px 20px rgba(180,130,20,.24);
  }
  #resultText .l1{display:block;white-space:nowrap;}
  #resultText .br{color:var(--yolk-d);font-weight:700;opacity:.9;padding:0 2px;}
  #resultText .nm{color:#C2410C;}
  #resultText .tail{display:block;font-size:.62em;color:var(--ink);letter-spacing:6px;margin-top:10px;}

  .sticker{
    background:#fff;border-radius:26px;padding:10px;border:4px solid #fff;line-height:0;
    box-shadow:0 12px 30px rgba(140,100,20,.26), 0 0 0 2px rgba(255,255,255,.9) inset;
    display:inline-block;width:clamp(140px,44vw,210px);
    margin-top:clamp(20px,4.4vh,34px);
  }
  .sticker img{display:block;width:100%;height:auto;border-radius:18px;}

  .pop-in{animation:popIn .5s cubic-bezier(.2,1.5,.45,1) both;}
  @keyframes popIn{
    0%{opacity:0;transform:scale(.4) rotate(-8deg);}
    60%{opacity:1;transform:scale(1.08) rotate(3deg);}
    100%{opacity:1;transform:scale(1) rotate(0);}
  }
  .rise-in{animation:riseIn .42s ease-out both;}
  @keyframes riseIn{0%{opacity:0;transform:translateY(16px);}100%{opacity:1;transform:translateY(0);}}
  .d1{animation-delay:.08s;}
  .d2{animation-delay:.18s;}

  /* ---------- 改名字 ---------- */
  #s-edit{
    position:absolute;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 22px);
    background:rgba(255,250,235,.94);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;transition:opacity .24s ease;
  }
  #s-edit.on{opacity:1;pointer-events:auto;}
  .panel{
    width:min(100%,380px);max-height:100%;overflow-y:auto;
    background:#fff;border-radius:22px;padding:20px 18px;
    box-shadow:0 14px 34px rgba(140,100,20,.22);
  }
  .panel h3{margin:0 0 4px;font-size:17px;letter-spacing:1px;}
  .panel p{margin:0 0 12px;font-size:12.5px;color:var(--ink2);line-height:1.6;}
  .panel textarea{
    width:100%;min-height:130px;font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);
    padding:12px 14px;border-radius:12px;border:1.5px solid #EADFC2;background:#FFFDF7;
    line-height:1.7;resize:none;-webkit-appearance:none;
  }
  .panel textarea:focus{outline:none;border-color:var(--yolk);background:#fff;}
  .panel .row{display:flex;gap:10px;margin-top:16px;}
  .panel .row button{
    flex:1;border:0;font-family:inherit;font-weight:900;font-size:15px;letter-spacing:1px;
    padding:13px 0;border-radius:999px;cursor:pointer;
  }
  .panel .ok{background:linear-gradient(180deg,#FFE071,#FFC61A);color:#4A3200;box-shadow:0 4px 0 #D89A00;}
  .panel .no{background:#F4F1E8;color:var(--ink2);}
  .panel .row button:active{transform:translateY(2px);}

  @media (max-height:660px){
    .reel{margin-top:12px;}
    .btn{margin-top:14px;padding:14px 0;}
    .sticker{width:clamp(112px,34vw,160px);margin-top:16px;}
    .title{font-size:clamp(24px,7.6vw,34px);}
  }
</style>
</head>
<body>
<div id="app">

  <section id="s-main">
    <p class="kicker">随机点名</p>
    <h1 class="title"><span class="br">{</span>谁被选中<span class="br">}</span></h1>

    <div class="reel" id="reel">
      <div class="band"></div>
      <div class="strip" id="strip"></div>
    </div>

    <button class="btn" id="btnGo">开 始 点 名</button>
    <button class="tune" id="btnTune">改名字</button>
  </section>

  <section id="s-result">
    <h1 id="resultText"></h1>
    <div class="sticker pop-in d1"><img id="resPic" alt="奶龙" draggable="false"></div>
    <button class="btn rise-in d2" id="btnAgain">再点一次</button>
  </section>

  <section id="s-edit">
    <div class="panel">
      <h3>改名字</h3>
      <p>一行一个，或用逗号隔开。最多 40 个，改完存在本机。</p>
      <textarea id="editArea" placeholder="小天才&#10;大妈&#10;鱼头蛋挞"></textarea>
      <div class="row">
        <button class="no" id="btnEditCancel">取消</button>
        <button class="ok" id="btnEditSave">保存</button>
      </div>
    </div>
  </section>

</div>

  }
  function beep(freq, dur, type, vol){
    var a = audio(); if(!a) return;
    try{
      if(a.state === "suspended") a.resume();
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "triangle"; o.frequency.value = freq;
      var t = a.currentTime, v = vol == null ? .07 : vol;
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur + .02);
    }catch(e){}
  }
  function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
  var lastTick = 0;
  function tick(){
    var now = Date.now();
    if(now - lastTick < 38) return;
    lastTick = now;
    beep(1450, .026, "square", .032);
  }

  /* ---------- 滚动条 ---------- */
  var strip = document.getElementById("strip");
  var reel = document.getElementById("reel");
  var btnGo = document.getElementById("btnGo");
  var ROUNDS = 9;                 // 名字重复多少轮
  var H = 0;                      // 单格高度，由 CSS 变量算出
  var idx = 0, rolling = false;

  function unitH(){
    var v = getComputedStyle(reel).getPropertyValue("--h").trim();
    // --h 由 CSS clamp 给出，实际取第一格的高度最稳
    var first = strip.firstChild;
    return first ? first.getBoundingClientRect().height : (parseFloat(v) || 110);
  }
  function yFor(i, h){ return (1 - i) * h; }

  function build(){
    strip.innerHTML = "";
    var total = (ROUNDS + 3) * NAMES.length;
    for(var i = 0; i < total; i++){
      var d = document.createElement("div");
      d.className = "it";
      d.textContent = NAMES[i % NAMES.length];
      strip.appendChild(d);
    }
    H = unitH();
    idx = NAMES.length;          // 初始停在第二轮，上方也有内容，不像空槽
    strip.style.transition = "none";
    strip.style.transform = "translateY(" + yFor(idx, H) + "px)";
    markMid(idx);
  }

  function markMid(i){
    var kids = strip.children;
    for(var k = 0; k < kids.length; k++) kids[k].classList.remove("mid");
    if(kids[i]) kids[i].classList.add("mid");
  }

  /* 滚动条位置会一直往下累加，快到头时重建一次；
     重建后把 idx 归位到同一个名字上，画面完全不跳（名字是循环重复的）。 */
  function recycle(){
    var n = NAMES.length;
    if(idx + ROUNDS * n + n < strip.children.length) return;
    var keep = idx % n;
    build();                       // 重建，build 里 idx = n
    idx = n + keep;
    strip.style.transition = "none";
    strip.style.transform = "translateY(" + yFor(idx, H) + "px)";
    markMid(idx);
  }

  function roll(){
    if(rolling) return;
    rolling = true;
    btnGo.disabled = true;
    audio();
    recycle();
    strip.style.transition = "none";

    var n = NAMES.length;
    var w = Math.floor(Math.random() * n);
    var delta = ((w - (idx % n)) % n + n) % n;     // 让落点正好落在第 w 个名字上
    var from = idx;
    var to = idx + ROUNDS * n + delta;
    var h = H || unitH();
    H = h;

    var DUR = 3400 + Math.random() * 500;
    var start = performance.now();
    var lastIdx = -1;

    function ease(t){ return 1 - Math.pow(1 - t, 3.6); }

    function frame(now){
      var t = Math.min(1, (now - start) / DUR);
      var cur = from + (to - from) * ease(t);
      strip.style.transform = "translateY(" + yFor(cur, h) + "px)";
      var ci = Math.round(cur);
      if(ci !== lastIdx){ lastIdx = ci; tick(); markMid(ci); }
      if(t < 1){ requestAnimationFrame(frame); }
      else {
        strip.style.transform = "translateY(" + yFor(to, h) + "px)";
        markMid(to);
        idx = to;
        rolling = false;
        btnGo.disabled = false;
        finish(NAMES[w]);
      }
    }
    requestAnimationFrame(frame);
  }

  function finish(name){
    var el = document.getElementById("resultText");
    el.innerHTML = '<span class="l1"><span class="br">{</span><span class="nm"></span><span class="br">}</span></span>' +
                   '<span class="tail">已被选中</span>';
    el.querySelector(".nm").textContent = name;
    fitText(el);

    beep(660, .12, "triangle", .08);
    setTimeout(function(){ beep(880, .12, "triangle", .08); }, 110);
    setTimeout(function(){ beep(1170, .26, "triangle", .09); }, 230);
    buzz([26, 55, 26, 55, 60]);
    setTimeout(function(){ document.getElementById("s-result").classList.add("on"); }, 320);
  }

  function fitText(el){
    var p = el.parentNode, cs = getComputedStyle(p);
    var max = p.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
    var size = Math.min(48, window.innerWidth * 0.094);
    el.style.fontSize = size + "px";
    var guard = 0;
    while(el.scrollWidth > max && size > 14 && guard < 60){
      size -= 1.5; guard++;
      el.style.fontSize = size + "px";
    }
  }

  /* ---------- 交互 ---------- */
  btnGo.addEventListener("click", roll);
  reel.addEventListener("click", roll);
  document.getElementById("btnAgain").addEventListener("click", function(){
    document.getElementById("s-result").classList.remove("on");
    beep(520, .09, "triangle", .05); buzz(10);
  });

  /* ---------- 改名字 ---------- */
  var edit = document.getElementById("s-edit");
  var area = document.getElementById("editArea");
  document.getElementById("btnTune").addEventListener("click", function(){
    area.value = NAMES.join("\n");
    edit.classList.add("on");
    beep(620, .07, "triangle", .05);
  });
  document.getElementById("btnEditCancel").addEventListener("click", function(){
    edit.classList.remove("on"); beep(420, .07, "triangle", .05);
  });
  document.getElementById("btnEditSave").addEventListener("click", function(){
    var vals = area.value.split(/[,，\n\r]+/).map(function(s){ return s.trim().slice(0, 10); }).filter(Boolean);
    if(vals.length < 2){
      beep(200, .18, "sawtooth", .06); buzz(30);
      return;
    }
    NAMES = vals.slice(0, MAXN);
    try{ localStorage.setItem("rollcall_names", JSON.stringify(NAMES)); }catch(e){}
    build();
    edit.classList.remove("on");
    beep(880, .1, "triangle", .07); buzz(14);
  });

  /* ---------- 启动 ---------- */
  build();
  // --h 需要 CSS 先算出来，再量一次
  setTimeout(function(){ H = unitH(); strip.style.transform = "translateY(" + yFor(idx, H) + "px)"; }, 60);
  window.addEventListener("resize", function(){
    H = unitH();
    strip.style.transition = "none";
    strip.style.transform = "translateY(" + yFor(idx, H) + "px)";
    var t = document.getElementById("resultText");
    if(t && t.textContent) fitText(t);
  });
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
  document.addEventListener("dblclick", function(e){ e.preventDefault(); }, { passive:false });
})();
</script>
</body>
