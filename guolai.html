<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFE08A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>曾文静过来</title>
<style>
  :root{
    --yolk-d:#EFA90A;
    --ink:#2A2118;
    --ink2:#7A6748;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;padding:0;}
  body{
    position:fixed;inset:0;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 70% at 50% -10%, #FFF6D8 0%, rgba(255,246,216,0) 62%),
      linear-gradient(170deg,#FFFBF2 0%,#FFF3D6 45%,#FFE7A6 100%);
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
    overscroll-behavior:none;
  }
  #app{position:absolute;inset:0;overflow:hidden;}

  .screen{
    position:absolute;inset:0;display:block;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);
    opacity:0;pointer-events:none;transform:translateY(16px) scale(.98);
    transition:opacity .3s ease, transform .3s ease;
  }
  .screen.active{opacity:1;pointer-events:auto;transform:none;}

  .mid{
    min-height:100%;width:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:0;text-align:center;
  }

  .title{
    margin:0;font-weight:900;letter-spacing:3px;line-height:1.16;
    font-size:clamp(36px,12vw,58px);
    text-shadow:0 3px 0 #fff, 0 8px 18px rgba(180,130,20,.20);
  }
  .title .br{color:var(--yolk-d);font-weight:700;opacity:.9;padding:0 2px;}

  .btn{
    -webkit-appearance:none;appearance:none;border:0;cursor:pointer;
    font-family:inherit;font-weight:900;letter-spacing:2px;
    border-radius:999px;color:#4A3200;
    background:linear-gradient(180deg,#FFE071,#FFC61A);
    box-shadow:0 7px 0 #D89A00, 0 12px 24px rgba(190,130,0,.30);
    transition:transform .09s ease, box-shadow .09s ease;
    touch-action:manipulation;display:block;
  }
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #D89A00, 0 6px 12px rgba(190,130,0,.26);}
  .btn.big{
    font-size:clamp(24px,7.5vw,32px);padding:20px 0;width:min(100%,340px);
    margin-top:clamp(38px,10vh,64px);
  }
  .btn.mini{
    background:#fff;color:var(--ink2);font-weight:700;letter-spacing:1px;
    font-size:14px;padding:11px 26px;box-shadow:0 3px 0 #E6D9B8,0 6px 14px rgba(120,88,20,.12);
  }
  .btn.mini:active{box-shadow:0 1px 0 #E6D9B8,0 3px 8px rgba(120,88,20,.1);}

  .sticker{
    background:#fff;border-radius:26px;padding:10px;border:4px solid #fff;line-height:0;
    box-shadow:0 12px 30px rgba(140,100,20,.24), 0 0 0 2px rgba(255,255,255,.9) inset;
    display:inline-block;
  }
  .sticker img{display:block;width:100%;height:auto;border-radius:18px;}

  /* 第二面 */
  #s2 .title{font-size:clamp(38px,13vw,64px);}
  #s2 .sticker{width:clamp(160px,54vw,248px);margin-top:clamp(22px,5vh,40px);}
  #s2 .btn.mini{margin-top:clamp(26px,6vh,44px);}

  /* 入场动画 */
  .pop-in{animation:popIn .5s cubic-bezier(.2,1.5,.45,1) both;}
  @keyframes popIn{
    0%{opacity:0;transform:scale(.4) rotate(-8deg);}
    60%{opacity:1;transform:scale(1.08) rotate(3deg);}
    100%{opacity:1;transform:scale(1) rotate(0);}
  }
  .wobble{animation:wobble 2.6s ease-in-out .5s infinite;}
  @keyframes wobble{
    0%,100%{transform:rotate(-1.6deg) translateY(0);}
    50%{transform:rotate(1.6deg) translateY(-7px);}
  }
  .rise-in{animation:riseIn .45s ease-out both;}
  @keyframes riseIn{
    0%{opacity:0;transform:translateY(18px);}
    100%{opacity:1;transform:translateY(0);}
  }
  .d1{animation-delay:.06s;}
  .d2{animation-delay:.16s;}
  .d3{animation-delay:.26s;}

  @media (max-height:640px){
    .btn.big{margin-top:26px;padding:16px 0;font-size:22px;}
    #s2 .sticker{width:clamp(120px,38vw,168px);margin-top:18px;}
    #s2 .btn.mini{margin-top:20px;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ========== 第一面 ========== -->
  <section class="screen active" id="s1">
    <div class="mid">
      <h1 class="title rise-in"><span class="br">{</span>曾文静过来<span class="br">}</span></h1>
      <button class="btn big rise-in d2" id="btnCome">来了</button>
    </div>
  </section>

  <!-- ========== 第二面 ========== -->
  <section class="screen" id="s2">
    <div class="mid">
      <h1 class="title rise-in"><span class="br">{</span>坐下！！！<span class="br">}</span></h1>
      <div class="sticker pop-in d1"><img id="pic" alt="奶龙" draggable="false"></div>
      <button class="btn mini rise-in d3" id="btnAgain">再来一遍</button>
    </div>
  </section>

</div>

  var pic = document.getElementById("pic");
  pic.src = IMG;

  var s1 = document.getElementById("s1"), s2 = document.getElementById("s2");

  var actx = null;
  function beep(freq, dur, vol){
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === "suspended") actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle"; o.frequency.value = freq;
      var t = actx.currentTime;
      g.gain.setValueAtTime(vol || .08, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + .02);
    }catch(e){}
  }
  function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

  /* 重新播放入场动画 */
  function replay(sel){
    var els = document.querySelectorAll(sel + " .pop-in, " + sel + " .rise-in");
    for(var i=0;i<els.length;i++){
      var el = els[i];
      el.style.animation = "none";
      void el.offsetWidth;
      el.style.animation = "";
    }
  }

  function goTo(to, from){
    if(from) from.classList.remove("active");
    to.classList.add("active");
    replay("#" + to.id);
    to.scrollTop = 0;
  }

  document.getElementById("btnCome").addEventListener("click", function(){
    beep(720, .12, .08);
    setTimeout(function(){ beep(1080, .18, .08); }, 90);
    buzz([18, 40, 22]);
    goTo(s2, s1);
  });

  document.getElementById("btnAgain").addEventListener("click", function(){
    beep(520, .10, .06);
    buzz(12);
    goTo(s1, s2);
  });

  /* 第二面直接点奶龙也有反馈 */
  pic.addEventListener("pointerdown", function(){
    pic.classList.remove("wobble");
    void pic.offsetWidth;
    pic.classList.add("pop-in");
    beep(1180, .12, .07); buzz(16);
    setTimeout(function(){
      pic.classList.remove("pop-in");
      pic.classList.add("wobble");
    }, 520);
  });

  document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
  document.addEventListener("dblclick", function(e){ e.preventDefault(); }, { passive:false });
})();
</script>
